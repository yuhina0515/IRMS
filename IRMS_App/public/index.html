<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss: http://localhost:* ws://localhost:* https://cdn.jsdelivr.net; img-src 'self' data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRMS | Rehabilitation Monitor</title>
    <!-- Google Fonts: Outfit and Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- A1: Toast 通知容器 -->
    <div id="toast-container" class="toast-container"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel" id="sidebar">
            <!-- C2: Sidebar 收合按鈕 -->
            <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle Sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="logo">
                <h1>IRMS<span>.</span></h1>
                <p>Rehab Dashboard</p>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" id="nav-dashboard">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a>
                <a href="#" class="nav-item" id="nav-actions">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    Actions
                </a>
                <a href="#" class="nav-item" id="nav-history">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    History
                </a>
                <a href="#" class="nav-item" id="nav-settings">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Settings
                </a>
            </nav>
            <div class="connection-status">
                <div class="status-indicator" id="status-indicator"></div>
                <span id="status-text">Disconnected</span>
            </div>
            <button id="connect-btn" class="primary-btn">Connect Device</button>
            <div class="debug-log-panel" id="debug-log-panel">
                <div class="debug-log-header">
                    <span>STATUS LOG</span>
                    <span id="clear-log-btn" class="debug-log-clear">Clear</span>
                </div>
                <div id="debug-log" class="debug-log-content">[System initialized]</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="main-content"></main>
    </div>

    <!-- Record Pose Modal -->
    <div id="record-pose-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-panel modal-sm">
            <div class="modal-header">
                <h2>Record Current Pose (記憶姿勢)</h2>
                <button id="close-record-modal-btn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body modal-body-tight">
                <!-- Live angle display cards -->
                <div class="record-live-grid">
                    <div>
                        <div class="record-live-label">Thigh (大腿)</div>
                        <div id="record-live-thigh" class="record-live-value color-thigh">0.0&deg;</div>
                    </div>
                    <div>
                        <div class="record-live-label">Shin (小腿)</div>
                        <div id="record-live-shin" class="record-live-value color-shin">0.0&deg;</div>
                    </div>
                    <div>
                        <div class="record-live-label">Knee (膝夾角)</div>
                        <div id="record-live-knee" class="record-live-value color-accent">0.0&deg;</div>
                    </div>
                </div>

                <form id="record-pose-form" class="settings-form form-modal">
                    <div class="form-group">
                        <label>Action Name (動作名稱)</label>
                        <input type="text" id="record-form-name" placeholder="e.g. 我的復健動作" required>
                    </div>
                    <div class="form-group">
                        <label>Joint Protocol (關節協定)</label>
                        <select id="record-form-protocol" class="select-styled">
                            <option value="knee">Knee Flexion (膝彎曲)</option>
                            <option value="elbow">Elbow Flexion (肘彎曲)</option>
                            <option value="shoulder">Shoulder Abduction (肩外展)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Trigger Type (判定規則)</label>
                        <select id="record-form-type" class="select-styled">
                            <option value="joint_angle">Joint Flexion (關節角度達標)</option>
                            <option value="segment_elevation">Segment Elevation (直膝抬腿)</option>
                            <option value="segment_extension">Segment Extension (直膝後擺)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Target Angle (Captured) (°)</label>
                        <div class="capture-row">
                            <input type="number" id="record-form-target" required>
                            <button type="button" id="btn-re-capture" class="secondary-btn" style="padding: 10px 14px; font-size: 0.9rem;">Capture</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Tolerance (±°)</label>
                        <input type="number" id="record-form-tolerance" value="10" required>
                    </div>
                    <div class="form-group">
                        <label>Hold Time (ms)</label>
                        <input type="number" id="record-form-hold" value="3000" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="btn-cancel-record" class="secondary-btn">Cancel</button>
                        <button type="submit" class="primary-btn">Save Recorded Action</button>
                    </div>
                </form>
            </div>
        </div>
        <script type="module">
        async function bootstrap() {
            const views = ['dashboard', 'history', 'actions', 'settings'];
            const main = document.getElementById('main-content');
            if (main) {
                for (let v of views) {
                    const res = await fetch(`views/${v}.html`);
                    if (res.ok) {
                        main.insertAdjacentHTML('beforeend', await res.text());
                    }
                }
            }
            await import('./js/main.js');
        }
        bootstrap();
    </script>
</body>
</html>
