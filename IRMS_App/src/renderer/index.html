<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!--
      內容安全政策 (CSP):
      所有資源皆為本地打包,無需外部 CDN。img 允許 data: 供內嵌 SVG/icon 使用。
      Web Bluetooth 不受 CSP connect-src 限制(屬瀏覽器原生 API),故無需開放 localhost。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRMS | 智慧復健監測系統</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
