[package]
name = "irms_app_native"
version = "0.0.1"
edition = "2021"
description = "Phase 1 prototype: Rust-native (Slint) live-session screen on simulated data"
publish = false

[dependencies]
irms_core = { path = "../IRMS_Core" }
serde_json = "1"
same-file = "1"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
