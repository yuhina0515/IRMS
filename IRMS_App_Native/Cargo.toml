[package]
name = "irms_app_native"
version = "0.0.1"
edition = "2021"
description = "Phase 1 prototype: Rust-native (Slint) live-session screen on simulated data"
publish = false

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2"] }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
