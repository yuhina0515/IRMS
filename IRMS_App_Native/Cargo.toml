[package]
name = "irms_app_native"
version = "1.3.0-beta.6"
edition = "2021"
description = "IRMS Rust-native Windows beta: Slint interface with isolated session storage"
publish = false

[dependencies]
irms_core = { path = "../IRMS_Core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
same-file = "1"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1"
tauri-winres = "0.3.6"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.16", default-features = false }
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_Media_Speech", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
