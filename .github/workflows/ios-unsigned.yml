name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [feat/ios-unsigned-ipa]
    paths: ['.github/workflows/ios-unsigned.yml']

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: IRMS_App_Tauri
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: IRMS_App_Tauri/package-lock.json

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios

      - run: npm ci

      - name: Generate Xcode project
        run: npx tauri ios init --ci

      - name: Disable code signing in generated project
        run: |
          pbx=src-tauri/gen/apple/irms_app_tauri.xcodeproj/project.pbxproj
          sed -i '' 's/buildSettings = {/buildSettings = {				CODE_SIGNING_ALLOWED = NO;				CODE_SIGNING_REQUIRED = NO;				CODE_SIGN_IDENTITY = "";/' "$pbx"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/' "$pbx"
          grep -c CODE_SIGNING_ALLOWED "$pbx"

      - name: Build app
        run: |
          set +e
          npx tauri ios build --target aarch64 --ci --export-method debugging 2>&1 | tail -60
          set -e
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name '*.app' -path '*/Products/release-iphoneos/*' -maxdepth 6 | head -1)
          echo "app: $APP"
          test -n "$APP"
          test -f "$APP/Info.plist"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry IRMS_unsigned.ipa Payload
          test $(stat -f%z IRMS_unsigned.ipa) -gt 1000000
          ls -la IRMS_unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: IRMS-unsigned-ipa
          path: IRMS_App_Tauri/IRMS_unsigned.ipa

          if-no-files-found: error
