name: iOS unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: IRMS_App_Tauri
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: IRMS_App_Tauri/package-lock.json

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios

      - run: npm ci

      - name: Generate Xcode project
        run: npx tauri ios init --ci

      - name: Build unsigned app
        run: |
          npx tauri ios build --target aarch64 --ci --debug 2>&1 | tail -80 || true
          find src-tauri/gen/apple -name '*.app' -maxdepth 6 | head

      - name: Upload build tree for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen-apple
          path: IRMS_App_Tauri/src-tauri/gen/apple
          if-no-files-found: warn
