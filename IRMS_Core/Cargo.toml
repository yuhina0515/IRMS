[package]
name = "irms_core"
version = "0.1.0"
edition = "2021"
description = "IRMS logic with no UI-toolkit types: protocol, database, migrations, BLE connection lifecycle"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
