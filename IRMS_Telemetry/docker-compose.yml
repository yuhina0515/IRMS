services:
  irms-telemetry:
    build: .
    container_name: irms-telemetry
    restart: unless-stopped
    # READ_TOKEN lives only in the server-side .env (never committed). Ingest is open.
    env_file: .env
    environment:
      # Desktop running Caddy; only it may assert the client IP via X-Forwarded-For.
      TRUSTED_PROXY: "192.168.50.143"
    volumes:
      - ./data:/data
    ports:
      - "8120:8120"
