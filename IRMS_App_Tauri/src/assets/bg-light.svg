<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <!-- IRMS Liquid Glass wallpaper (light) — aurora mesh: layered soft glows + grain to prevent banding -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#e2e8f6"/>
    </linearGradient>
    <radialGradient id="lavender" cx="0.78" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#b9b5f2" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#c5c2f4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c5c2f4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sky" cx="0.12" cy="0.92" r="0.85">
      <stop offset="0" stop-color="#9cc4ff" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#aecfff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#aecfff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint" cx="0.62" cy="0.65" r="0.5">
      <stop offset="0" stop-color="#b7ecd4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b7ecd4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peach" cx="0.2" cy="0.1" r="0.45">
      <stop offset="0" stop-color="#ffdcc7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffdcc7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#base)"/>
  <rect width="1440" height="900" fill="url(#lavender)"/>
  <rect width="1440" height="900" fill="url(#sky)"/>
  <rect width="1440" height="900" fill="url(#mint)"/>
  <rect width="1440" height="900" fill="url(#peach)"/>
</svg>
