<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>即時監測</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="{{themeVars}};width:1280px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--canvas);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:16px;overflow:hidden">
  <header style="height:64px;flex-shrink:0;display:flex;align-items:center;gap:32px;padding:0 24px;box-sizing:border-box">
    <div style="display:flex;align-items:center;gap:10px;font-family:'Noto Serif TC',serif;font-weight:700;font-size:22px;letter-spacing:0.04em">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="9" style="fill:var(--accent)"/><path d="M12 6 L13 15 L21 18" fill="none" style="stroke:var(--onaccent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      IRMS
    </div>
    <nav aria-label="主要功能" style="display:flex;gap:4px;flex-grow:1">
      <a href="Main.dc.html" aria-current="page" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:22px;background:var(--tint);color:var(--accent);font-weight:700;text-decoration:none">即時監測</a>
      <a href="Actions.dc.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:22px;color:var(--muted);font-weight:500;text-decoration:none">動作處方</a>
      <a href="History.dc.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:22px;color:var(--muted);font-weight:500;text-decoration:none">療程紀錄</a>
      <a href="Settings.dc.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:22px;color:var(--muted);font-weight:500;text-decoration:none">設定</a>
    </nav>
    <div style="display:flex;align-items:center;gap:14px">
      <span role="status" style="display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)"><span style="width:10px;height:10px;border-radius:50%;background:var(--good)"></span>裝置已連線</span>
      <button style="height:44px;padding:0 20px;border-radius:22px;border:1.5px solid var(--edge);background:transparent;color:var(--ink);font:500 15px 'Noto Sans TC',sans-serif">中斷連線</button>
    </div>
  </header>

  <main style="flex-grow:1;min-height:0;padding:0 24px 24px;box-sizing:border-box;display:flex">
    <section aria-label="即時監測" style="flex-grow:1;min-width:0;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:hidden">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:22px 32px 0">
        <div>
          <h1 style="margin:0;font-family:'Noto Serif TC',serif;font-weight:700;font-size:30px;line-height:1.2">膝關節屈曲</h1>
          <p style="margin:6px 0 0;font-size:15px;color:var(--muted)">到達目標區後保持 · 目標 85–95° · 保持 5 秒</p>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span style="display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;background:var(--goodbg);color:var(--good);font-size:14px;font-weight:700">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 L6.5 12 L13 4.5" fill="none" style="stroke:var(--good)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            校準完成 · 14:02
          </span>
          <a href="Ready.dc.html" style="font-size:14px;color:var(--accent);font-weight:500">重新校準</a>
        </div>
      </div>

      <div style="flex-grow:1;min-height:0;display:flex;gap:32px;padding:14px 32px 20px;box-sizing:border-box">
        <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:space-between">
          <div>
            <div style="font-size:14px;font-weight:700;color:var(--muted);letter-spacing:0.06em">主指標 · 屈膝角度</div>
            <div style="display:flex;align-items:baseline;margin-top:4px">
              <span style="font-family:'Noto Serif TC',serif;font-weight:700;font-size:176px;line-height:1;font-variant-numeric:tabular-nums">87</span>
              <span style="font-family:'Noto Serif TC',serif;font-weight:500;font-size:72px;line-height:1;color:var(--accent)">°</span>
            </div>
            <div style="display:inline-flex;align-items:center;gap:10px;margin-top:10px;height:44px;padding:0 18px;border-radius:22px;background:var(--goodbg);color:var(--good);font-size:20px;font-weight:700">
              <span style="width:10px;height:10px;border-radius:50%;background:var(--good)"></span>在目標區內 · 再保持 3 秒
            </div>
          </div>

          <div role="img" aria-label="角度尺:目前 87 度,目標區 85 到 95 度">
            <div style="position:relative;height:30px">
              <span style="position:absolute;left:60.71%;font-size:13px;font-weight:700;color:var(--good);white-space:nowrap">目標 85–95°</span>
            </div>
            <div style="position:relative;height:16px;border-radius:8px;background:var(--soft)">
              <div style="position:absolute;left:60.71%;width:7.14%;top:0;bottom:0;border-radius:8px;background:var(--good)"></div>
              <div style="position:absolute;left:62.14%;top:-9px;width:4px;height:34px;margin-left:-2px;border-radius:2px;background:var(--accent)"></div>
            </div>
            <div style="position:relative;height:26px;margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums">
              <span style="position:absolute;left:0">0°</span>
              <span style="position:absolute;left:21.43%;margin-left:-10px">30°</span>
              <span style="position:absolute;left:42.86%;margin-left:-10px">60°</span>
              <span style="position:absolute;left:64.29%;margin-left:-10px">90°</span>
              <span style="position:absolute;left:85.71%;margin-left:-14px">120°</span>
            </div>
          </div>

          <div style="display:flex;gap:28px;align-items:flex-end">
            <div style="flex:1 1 0">
              <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px"><span>本次保持</span><span style="font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700">2.0 / 5 秒</span></div>
              <div style="display:flex;gap:6px">
                <span style="flex:1;height:12px;border-radius:6px;background:var(--good)"></span>
                <span style="flex:1;height:12px;border-radius:6px;background:var(--good)"></span>
                <span style="flex:1;height:12px;border-radius:6px;background:var(--soft)"></span>
                <span style="flex:1;height:12px;border-radius:6px;background:var(--soft)"></span>
                <span style="flex:1;height:12px;border-radius:6px;background:var(--soft)"></span>
              </div>
            </div>
            <div style="flex:1 1 0">
              <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px"><span>第 6 次</span><span style="font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700">已完成 5 / 10</span></div>
              <div style="display:flex;gap:6px">
                <span style="flex:1;height:12px;border-radius:6px;background:var(--accent)"></span>
                <span style="flex:1;height:12px;border-radius:6px;background:var(--accent)"></span>
                <span style="flex:1;height:12px;border-radius:6px;background:var(--accent)"></span>
                <span style="flex:1;height:12px;border-radius:6px;background:var(--accent)"></span>
                <span style="flex:1;height:12px;border-radius:6px;background:var(--accent)"></span>
                <span style="flex:1;height:12px;border-radius:6px;border:2px solid var(--accent);box-sizing:border-box"></span>
                <span style="flex:1;height:12px;border-radius:6px;background:var(--soft)"></span>
                <span style="flex:1;height:12px;border-radius:6px;background:var(--soft)"></span>
                <span style="flex:1;height:12px;border-radius:6px;background:var(--soft)"></span>
                <span style="flex:1;height:12px;border-radius:6px;background:var(--soft)"></span>
              </div>
            </div>
          </div>
        </div>

        <div style="flex:1 1 0;min-width:0;position:relative;border-radius:20px;background:var(--soft);display:flex;flex-direction:column">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0">
            <span style="font-size:14px;font-weight:700;color:var(--muted);letter-spacing:0.06em">動作姿態</span>
            <div role="group" aria-label="姿態顯示" style="display:inline-flex;padding:3px;border-radius:24px;background:var(--paper)">
              <button aria-pressed="true" style="height:44px;padding:0 18px;border:0;border-radius:22px;background:var(--accent);color:var(--onaccent);font:700 14px 'Noto Sans TC',sans-serif">2D 側面</button>
              <button aria-pressed="false" style="height:44px;padding:0 18px;border:0;border-radius:22px;background:transparent;color:var(--muted);font:500 14px 'Noto Sans TC',sans-serif">3D</button>
            </div>
          </div>
          <svg viewBox="0 0 440 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="側面腿部姿態,膝角 87 度" style="flex-grow:1;min-height:0;width:100%">
            <line x1="40" y1="372" x2="400" y2="372" style="stroke:var(--line)" stroke-width="2"/>
            <line x1="270" y1="230" x2="277" y2="350" style="stroke:var(--edge)" stroke-width="2" stroke-dasharray="5 6"/>
            <path d="M187 242 A84 84 0 0 1 186 228" fill="none" style="stroke:var(--good)" stroke-width="9" stroke-linecap="round"/>
            <path d="M274 300 A70 70 0 0 1 200 238" fill="none" style="stroke:var(--accent)" stroke-width="3"/>
            <line x1="260" y1="60" x2="270" y2="230" style="stroke:var(--thigh)" stroke-width="22" stroke-linecap="round"/>
            <line x1="270" y1="230" x2="81" y2="250" style="stroke:var(--shin)" stroke-width="18" stroke-linecap="round"/>
            <line x1="81" y1="250" x2="85" y2="290" style="stroke:var(--shin)" stroke-width="12" stroke-linecap="round"/>
            <circle cx="260" cy="60" r="9" style="fill:var(--paper);stroke:var(--ink)" stroke-width="3"/>
            <circle cx="270" cy="230" r="11" style="fill:var(--paper);stroke:var(--ink)" stroke-width="3"/>
            <circle cx="81" cy="250" r="8" style="fill:var(--paper);stroke:var(--ink)" stroke-width="3"/>
            <text x="198" y="318" text-anchor="end" font-size="26" font-weight="700" style="fill:var(--accent);font-family:'Noto Serif TC',serif">87°</text>
            <text x="278" y="62" font-size="14" style="fill:var(--muted);font-family:'Noto Sans TC',sans-serif">髖</text>
            <text x="288" y="226" font-size="14" style="fill:var(--muted);font-family:'Noto Sans TC',sans-serif">膝</text>
            <text x="62" y="236" font-size="14" style="fill:var(--muted);font-family:'Noto Sans TC',sans-serif">踝</text>
          </svg>
          <p style="margin:0;padding:0 18px 16px;font-size:13px;color:var(--muted)">姿態僅作方向參考,判定以左側角度為準。</p>
        </div>
      </div>

      <div style="flex-shrink:0;height:96px;box-sizing:border-box;border-top:1px solid var(--line);display:flex;align-items:center;gap:36px;padding:0 32px">
        <div>
          <div style="font-size:13px;color:var(--muted)">動作</div>
          <div style="font-family:'Noto Serif TC',serif;font-weight:700;font-size:22px">膝關節屈曲</div>
        </div>
        <div>
          <div style="font-size:13px;color:var(--muted)">處方</div>
          <div style="font-size:18px;font-weight:500;font-variant-numeric:tabular-nums">90° ± 5° · 保持 5 秒 · 10 次</div>
        </div>
        <div style="flex-grow:1"></div>
        <div style="text-align:right">
          <div style="font-size:13px;color:var(--muted)">療程時間</div>
          <div style="font-family:'Noto Serif TC',serif;font-weight:700;font-size:28px;font-variant-numeric:tabular-nums">04:32</div>
        </div>
        <button style="height:52px;padding:0 28px;border-radius:26px;border:2px solid var(--danger);background:var(--dangerbg);color:var(--danger);font:700 17px 'Noto Sans TC',sans-serif">結束療程</button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const L = {canvas:'#EEEAE2',paper:'#FFFCF6',soft:'#E8E2D8',ink:'#29252D',muted:'#625C65',line:'#CFC6BD',edge:'#827784',accent:'#684563',onaccent:'#FFFFFF',tint:'#EDE1EA',good:'#286047',goodbg:'#E0EBDF',warn:'#805017',warnbg:'#F4E7CF',danger:'#B02D32',dangerbg:'#FAE5E0',thigh:'#805017',shin:'#286047'};
const D = {canvas:'#201E23',paper:'#29262D',soft:'#36313A',ink:'#F4EEE6',muted:'#C3B8C5',line:'#514853',edge:'#A698AA',accent:'#D9B6D0',onaccent:'#29252D',tint:'#463443',good:'#ACD7B8',goodbg:'#2D4033',warn:'#F0C182',warnbg:'#493922',danger:'#FFA7A0',dangerbg:'#502D30',thigh:'#F0C182',shin:'#ACD7B8'};
const t = this.props.dark ? D : L;
return { themeVars: Object.keys(t).map((k) => '--' + k + ':' + t[k]).join(';') };
}
}
</script>
</body>
</html>
